<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess.com - Premium Offer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #312e2b; color: white; text-align: center; padding-top: 50px; }
        .bait-content, .phishing-content { display: none; }
        .login-box { background-color: #262421; padding: 40px; border-radius: 8px; width: 300px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .alert-message { color: #ff4d4d; font-size: 14px; margin-bottom: 20px; font-weight: bold; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #4a4846; background-color: #312e2b; color: white; border-radius: 4px; }
        button, .btn-link { width: 100%; padding: 15px; background-color: #81b64c; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; box-sizing: border-box; }
        button:hover, .btn-link:hover { background-color: #95c45f; }
    </style>
</head>
<body>

    <div id="bait" class="bait-content">
        <h2>🎉 Exclusive Offer! 🎉</h2>
        <p>Get 1 Year of Ad-Free Chess.com Premium!</p>
        <a href="https://www.chess.com/no-ads" class="btn-link" style="width: 200px;">Claim Offer Now</a>
    </div>

    <div id="phish" class="phishing-content">
        <div class="login-box">
            <h2>Login to continue</h2>
            <div class="alert-message">Your session has expired. Please log in again to claim your offer.</div>
            <input type="text" placeholder="Username, Phone, or Email">
            <input type="password" placeholder="Password">
            <button onclick="alert('🚨 CRITICAL IMPACT DEMONSTRATION 🚨\n\nThrough the Open Redirect vulnerability, the victim was seamlessly routed to this attacker-controlled page.\n\nIn a real-world attack, any username and password entered here would be sent directly to the hacker\'s server, leading to complete Account Takeover (ATO)!')">Log In</button>
        </div>
    </div>

    <script>
        if (document.referrer.includes("chess.com")) {
            document.getElementById("phish").style.display = "block";
        } else {
            window.location.href = "https://www.chess.com/no-ads";
        }
    </script>
</body>

</html>
